- when: "2026"
  date: "2026-11-06"
  type: "impact"
  up: true
  title: "FacMed Hack #1 — Digital Phenotyping of Mental Health"
  role: "Hackathon design"
  venue: "Campus Biotech, Geneva"
  date_end: "2026-11-07"
  url: "https://facmed-hack.pages.dev/fr/"
  cat: "social"
  blob: >
    The first hackathon of the UNIGE Faculty of Medicine turns digital phenotyping on mental
    health into 32 hours of building. Around fifty master's and doctoral students, clinicians,
    researchers and engineers work in interdisciplinary teams on six challenges submitted by
    researchers themselves, so the problems are the ones the field actually has. It is run with
    Campus Neuro, the Synapsy research centre, the Swiss Centre for Affective Sciences, the Wyss
    Center, the Geneva University Hospitals and EPFL, at Campus Biotech. The aim is deliberately
    concrete: teams leave not with slideware but with project sketches solid enough to be
    funded, bridging clinic, laboratory and engineering in one room.
  draft: true

- when: "2026"
  type: "impact"
  up: true
  date_label: "Autumn"
  title: "TU Berlin Social Robotics Hack"
  role: "Co-instructor (Lehrbeauftragter)"
  venue: "TU Berlin, MAR campus · Cognitive Psychology & Cognitive Ergonomics (KKE)"
  cat: "social"
  draft: true
  blob: >
    A build course rather than a lecture: Vibe-Coding Social Robots, run with Eva Wiese's
    cognitive ergonomics group at TU Berlin and taught with Matt Huebert. It opens with a needs
    library seeded from the lab's own research problems — validating and sharpening those needs
    is also how students earn one of the credit-bearing seats. Then five teaching sessions on
    AI-assisted building and on AI stewardship, delegating, verifying, overriding and refusing;
    an on-site hackathon at the MAR campus; and three supervised weeks hardening the result.
    Every team ships a runnable artefact the group can actually pick up — a stimulus generator,
    a gaze-cueing harness, an evaluation probe for LLM participants.

