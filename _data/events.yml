# Events — one file for everything I show up to do.
#
#   type: research   -> presenting my own work (conference paper, seminar, defence)
#   type: talk       -> invited talk, keynote, panel
#   type: teaching   -> courses, student cohorts, executive sessions
#   type: impact     -> hackathons, chairing, organising, programme design
#
#   To appear on the site an event needs a ~100-word explanation. Two ways:
#     topic: <slug>  -> shared blob in _data/topics.yml. Several events on the same
#                       subject point at one blob, and the blob lists them all.
#     blob: >        -> an explanation specific to this event.
#   An event with neither renders as a title with "details soon" and no expander.
#
#   when:    "2026" or "2026–27" (year drives the Future/Present/Past bucket)
#   date:    "2026-08-10" optional, for a precise day; shown in the meta line
#   status:  upcoming | ongoing | past — optional, overrides the derived bucket
#   up:      true -> pin to Future regardless of year
#   cat:     forecasting | complex | hackathons | collective | cyber | social
#   tbc:     true -> date not yet confirmed
#   draft:   true -> blob written from public sources, not yet reviewed by TM
#
# Fields: when, date, type, title, role, venue, host, host_url, url, cat,
#         status, up, tbc, topic, blob, draft.

