# Site settings
title: maillart.xyz | thomas maillart
email: thomas@maillart.xyz
description: Research, grants & awards, and SDG-aligned hackathon impact
url: "https://maillart.xyz"
baseurl: ""
github_username: wazaahhh

# Keep theme null; we use lightweight custom HTML/CSS in layouts.
theme: null

# Ship the custom-domain file (Jekyll excludes CNAME by default).
include: ["CNAME"]

# Don't publish build/tooling files to the live site.
exclude:
  - scripts/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - README.md

# output:false -> the items stay readable from Liquid (site.research etc.) but
# no standalone pages are published. They had no layout shell (no doctype/head/
# CSS), nothing linked to them, and they were still crawlable. Flip back to true
# once they get a real layout.
collections:
  research:
    output: false
  grants:
    output: false
  sdg_hackathons:
    output: false

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      type: research
    values:
      layout: "collection-item"
  - scope:
      type: grants
    values:
      layout: "collection-item"
  - scope:
      type: sdg_hackathons
    values:
      layout: "collection-item"
