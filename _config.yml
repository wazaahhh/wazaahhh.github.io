# Site settings
# Name first: people search the person, not the domain. The title is the single
# strongest on-page ranking signal and what shows as the blue link in results.
title: "Thomas Maillart — technological forecasting, cyber risk & collective intelligence"
email: thomas@maillart.xyz
description: >-
  Thomas Maillart, senior lecturer at the University of Geneva (GSEM). Research on
  technological forecasting, the economics of cybersecurity, collective intelligence and
  social-interaction science — plus grants, talks, teaching and SDG hackathon programmes.
url: "https://maillart.xyz"
baseurl: ""
github_username: wazaahhh

# Keep theme null; we use lightweight custom HTML/CSS in layouts.
theme: null

# jekyll-sitemap ships inside the github-pages gem and is whitelisted on GitHub
# Pages, so /sitemap.xml is generated on every build with no extra dependency.
plugins:
  - jekyll-sitemap

# Ship the custom-domain file (Jekyll excludes CNAME by default).
include: ["CNAME", "robots.txt"]

# Don't publish build/tooling files to the live site.
exclude:
  - scripts/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - README.md
  - .mailbox/          # private mail store; never built, never published

# output:false -> the items stay readable from Liquid (site.research etc.) but
# no standalone pages are published. They had no layout shell (no doctype/head/
# CSS), nothing linked to them, and they were still crawlable. Flip back to true
# once they get a real layout.
collections:
  research:
    output: false
  grants:
    output: false
  sdg_hackathons:
    output: false

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      type: research
    values:
      layout: "collection-item"
  - scope:
      type: grants
    values:
      layout: "collection-item"
  - scope:
      type: sdg_hackathons
    values:
      layout: "collection-item"
